<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Ruang 3D berbasis henryheffernan.com karya Henry Heffernan (MIT, lihat LICENSE.md) -->
  <title>Rony Risvaldo — Portfolio</title>
  <meta name="description"
    content="Portfolio of Rony Risvaldo, an Informatics student and developer from North Sumatra, Indonesia.">
  <meta name="author" content="Rony Risvaldo">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://ronyrisvaldo.dev/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rony Risvaldo Portfolio">
  <meta property="og:title" content="Rony Risvaldo — Portfolio">
  <meta property="og:description"
    content="Portfolio of Rony Risvaldo, an Informatics student and developer from North Sumatra, Indonesia.">
  <meta property="og:url" content="https://ronyrisvaldo.dev/">
  <meta property="og:image" content="https://ronyrisvaldo.dev/assets/img/profil.jpeg">
  <meta name="twitter:card" content="summary">

      "https://github.com/RonyRisvaldoLumbanBatu",

  <link rel="icon" href="../static/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" sizes="180x180" href="../static/assets/apple-touch-icon.png">
</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop autoplay width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop autoplay width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>
  </div>
</body>

</html>
